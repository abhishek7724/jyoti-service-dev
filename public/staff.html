<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142a4a">
<title>Jyoti Service Desk</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/staff.css">
<script type="module" src="/staff.js"></script>
</head>
<body>
<header><div class="shell header-content"><a class="brand" href="/staff"><span class="mark">JR</span><span>Jyoti Refrigeration<small>Service Desk</small></span></a><div class="actions"><span id="staff-name"></span><button id="logout" class="secondary" hidden>Sign out</button></div></div></header>
<main class="shell">
<section id="sign-in" class="panel narrow">
<h1>Staff sign in</h1>
<form id="login-form" class="grid">
<label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button>Sign in</button>
</form>
</section>
<section id="desk" hidden>
<div class="section-title"><h1 id="page-title">Service tickets</h1><div class="actions" id="page-actions"></div></div>
<nav id="nav" aria-label="Staff areas"></nav>
<div id="content"></div>
</section>
<p id="notice" role="status" aria-live="polite"></p>
</main>
<dialog id="dialog">
<div class="section-title"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="secondary" aria-label="Close dialog">Close</button></div>
<div id="dialog-content"></div>
<p id="dialog-error" role="alert"></p>
</dialog>
</body>
</html>
