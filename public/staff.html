<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142a4a">
<title>Jyoti Service Desk</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/staff.css">
<style>
#login-form input {
  color-scheme: light;
  color: #142a4a;
  -webkit-text-fill-color: #142a4a;
  caret-color: #142a4a;
  background-color: #fff;
  font-size: 16px;
}
</style>
<script type="module" src="/staff.js"></script>
<link rel="stylesheet" href="/ticket-detail.css">
<link rel="stylesheet" href="/billing.css">
</head>
<body>
<header><div class="shell header-content"><button type="button" id="menu-toggle" class="secondary menu-toggle" aria-controls="sidebar" aria-expanded="false" hidden>Menu</button><a class="brand" href="/staff"><span class="mark">JR</span><span>Jyoti Refrigeration<small>Service Desk</small></span></a><div class="actions"><span id="staff-name"></span><button id="logout" class="secondary" hidden>Sign out</button></div></div></header>
<aside id="sidebar" class="sidebar" hidden><button type="button" id="close-sidebar" class="secondary sidebar-close">Close menu</button><nav id="nav" aria-label="Staff modules"></nav></aside>
<button type="button" id="sidebar-backdrop" class="sidebar-backdrop" aria-label="Close menu" tabindex="-1" hidden></button>
<main class="shell">
<p id="boot-status" role="status"><span class="waiting-spinner" aria-hidden="true"></span><span class="sr-only">Please wait</span></p>
<section id="sign-in" class="panel narrow" hidden>
<h1>Staff sign in</h1>
<form id="login-form" class="grid">
<label>Username<input name="username" type="text" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
<label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" required autocomplete="current-password" enterkeyhint="go"></label>
<button>Sign in</button>
</form>
</section>
<section id="desk" hidden>
<div class="section-title"><h1 id="page-title">Service tickets</h1><div class="actions" id="page-actions"></div></div>
<div id="content"></div>
</section>
<p id="notice" role="status" aria-live="polite"></p>
</main>
<dialog id="dialog">
<div class="section-title"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="secondary" aria-label="Close dialog">Close</button></div>
<div id="dialog-content"></div>
<p id="dialog-error" role="alert"></p>
</dialog>
</body>
</html>
